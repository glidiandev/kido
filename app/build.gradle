plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.glidian.kido'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.glidian.kido'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            // Smaller APK and a faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
